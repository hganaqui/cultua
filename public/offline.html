<!-- ✅ public/offline.html (NOVO - Página offline) -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CULTUA - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1A1A1A 0%, #2d2d2d 100%);
      color: #F8F6EF;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      color: #b8b8b8;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background-color: #B8860B;
      color: #FFFFFF;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #9a7009;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">CULTUA</div>
    <div class="emoji">📡</div>
    <h1>Você está offline</h1>
    <p>Parece que você perdeu a conexão. Verifique sua internet e tente novamente.</p>
    <button class="button" onclick="location.reload()">
      Tentar novamente
    </button>
  </div>
</body>
</html>
